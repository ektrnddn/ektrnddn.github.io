# Home page intro. Words in [[double brackets]] are highlighted.
greeting: Hello there!
intro: >-
  I'm Ekaterine (Eka) Dadiani, a Ph.D. candidate in [[Physics]] at
  [[Carnegie Mellon University]], working with Antonella Palmese and Tiziana Di Matteo.
  I look for [[pairs of massive black holes]] in the [[DESI]] survey and the [[ASTRID]]
  simulation: the progenitors of mergers that [[LISA]] will detect.
hero:
  # Rendered as: {start} <em>{emphasis}</em> {end}
  start: "Massive black hole pairs,"
  emphasis: "from kiloparsecs to sub-parsec,"
  end: "across cosmic time."
  lede: >-
    I use DESI spectroscopy, the ASTRID cosmological simulation and machine learning
    to find and count dual and binary AGN, and to forecast what LISA and pulsar timing
    arrays will detect.
  figure: /figures/dr_z_bigmac_duals.jpg
  figure_alt: Redshift versus projected separation for DESI DR1 dual AGN
  figure_caption: >-
    Redshift versus projected separation for 6,953 DESI DR1 dual AGN, against every
    literature candidate to date. Dadiani et al. 2026.
research_lede: >-
  One question at three separation scales: where are the massive black hole pairs,
  how many are there, and which ones will gravitational-wave detectors hear?
bio: >-
  I study massive black hole pairs: where they are, how many there are, and which ones
  LISA will eventually detect. The work follows the whole evolutionary chain, from
  kiloparsec-scale dual AGN to sub-parsec binaries, and their host galaxy parameters.
