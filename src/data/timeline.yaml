# The timeline on the About page, in three columns: where I studied (eras); inside each, what
# mattered most (projects: research and the papers it led to, programmes, the start-up), each
# with a bar as long as it lasted; and the small things along the way.
#
# Dates are "YYYY", "YYYY-MM" or "YYYY-MM-DD" (quoted); a year alone means some time that year.
# w is the weight: 1 for what matters most, 2 normal, 3 small.
# The first column is education in general: the schools, and, smaller and with a dot on the line,
# the collaborations joined (`kind: collaboration`) and the schools and trainings along the way
# (`kind: training`). Those branch off the line on their date and run beside it until `to`
# (none, or a date still to come: ongoing).
# Papers name a publication by its id in publications.yaml (for the link); title and venue
# here are what the timeline shows. A paper without an id is not out yet.
# Sources: the current CV and the older CVs (2016-2024). Dates marked "?" are guesses.

