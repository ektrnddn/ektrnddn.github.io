- role: Graduate Research Assistant
  org: Carnegie Mellon University
  place: Pittsburgh, PA
  start: Jan 2024
  end: present
  bullets:
    - "Massive black hole binaries and dual AGN in DESI, with Antonella Palmese. Leading the first systematic search for sub-parsec massive black hole binaries in DESI spectra, combining Doppler velocity offsets of broad emission lines with autoencoders trained on the full quasar sample to separate orbital signatures from intrinsic AGN variability. Built the largest uniformly selected census of kpc-scale dual and offset AGN in DESI and characterised their host galaxies (Dadiani et al. 2026). Constructed matching mock DESI samples from the ASTRID simulation and evolved the observed pairs forward to forecast LISA and PTA detection rates (Chen, Zhou, Dadiani et al. 2025)."
    - "Dual AGN host galaxies in cosmological simulations, with Tiziana Di Matteo. Measured the stellar kinematics and morphology of z ∼ 2 dual AGN hosts in ASTRID, showing that they are mostly rotation-supported disks rather than merger-disturbed spheroids, and linked disk dynamics and gas inflow to black hole fuelling (Dadiani et al. 2024)."
