# Research page: the projects as a hand of cards, by date, left to right. The front shows the figure
# (or the status, for work still to come); the back, turned over with a click, the stage in the
# film (movie.yaml), the title, one sentence, the role and the links. Titles must match movie.yaml.
thesis:
  - title: "z ∼ 2 dual AGN host galaxies are disky: stellar kinematics in the ASTRID Simulation"
    short: Dual AGN hosts are disky
    stage: Dual AGN
    role: First author
    year: 2024
    finding: "Most galaxies hosting two active black holes at z ∼ 2 are rotating disks, not merger-disturbed spheroids."
    figure: /figures/disky_sfr_figure.jpg
    figure_alt: Stellar density maps and energy–circularity diagrams of dual AGN hosts in ASTRID
    link: https://doi.org/10.33232/001c.124451
  - title: "Connecting current and future dual AGN searches to LISA and PTA gravitational wave detections"
    short: From dual AGN to LISA and PTA
    stage: Merger
    role: Co-author, built the DESI mock samples
    year: 2026
    finding: "Survey-matched dual AGN followed forward in ASTRID, to see which become gravitational-wave sources."
    figure: /figures/papers/gw-merger-rates.jpg
    figure_alt: Expected full-sky massive black hole merger rates from survey-matched mock samples
    link: https://doi.org/10.3847/1538-4357/ae84ce
  - title: "Cosmic Pairs: a DESI census of dual and offset AGN as precursors to massive black hole binaries"
    short: "Cosmic Pairs: dual AGN in DESI"
    stage: Dual AGN
    role: First author
    year: 2026
    finding: "More than 7,000 dual AGN in DESI's first data release, from today back to z ≈ 3.6: the largest census so far."
    figure: /figures/dr_z_bigmac_duals.jpg
    figure_alt: Redshift versus projected separation for DESI DR1 dual AGN and literature candidates
    link: https://arxiv.org/abs/2607.27390
    live: https://ektrnddn.github.io/dualagn-explorer/
  - title: "Cosmic Pairs: a DESI census of massive black hole binaries"
    short: "Cosmic Pairs: binaries in DESI"
    stage: Binary
    role: Leading the search
    status: In preparation
    finding: "The first systematic search for sub-parsec binaries in DESI spectra: broad lines that shift between epochs, with autoencoders to tell orbital motion from ordinary variability."
    figure: /figures/blrfit-classes.jpg
    figure_alt: Broad H-beta lines of four SDSS quasars, one of each profile class, as fitted by blrfit
    code: https://github.com/ektrnddn/blrfit
  - title: "Scaling up: variational autoencoders on DESI DR3"
    short: "Scaling up: DESI DR3"
    stage: Binary
    status: Coming soon
    finding: "Variational autoencoders on the third DESI data release."

# Earlier work. [n] in the text points at the n-th entry of `earlier`.
earlier_text: >-
  Before moving to black holes I worked on magnetohydrodynamics. At Ilia State University
  and KU Leuven, with Andria Rogava and Stefaan Poedts, I revisited self-similar solutions
  for astrophysical MHD transients and found new classes of solutions under revised
  geometric and kinematic assumptions [1]. My B.Sc. thesis with Nana Shatashvili,
  “Transient Flow and Magnetic Field Generation in 2-Temperature Degenerate Electron-Ion
  Gas due to Catastrophic Relaxation of Equilibrium”, extended this to the relativistic
  gas of binary systems [2]. As a CERN summer student with Nicolas Mounet I derived
  closed-form expressions for the indirect space-charge wake function of axisymmetric
  beam pipes [3].
earlier:
  - rogava2022-self-similarity
  - saralidze2025-catastrophic
  - mounet2022-wake
