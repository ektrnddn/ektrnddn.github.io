# Copy this file into the CV repository as .github/workflows/notify-site.yml
#
# Every push (including Overleaf's GitHub sync) tells the website repository to
# rebuild, which recompiles the CV and republishes the PDF.
#
# Needs one repository secret in the CV repo, SITE_DISPATCH_TOKEN: a fine-grained
# personal access token with Contents: read and write on ektrnddn/ektrnddn.github.io.

name: Notify website

on:
  push:
    branches: [main, master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}
          repository: ektrnddn/ektrnddn.github.io
          event-type: cv-updated
